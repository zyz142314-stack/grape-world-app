/* Layout: single-light farmer app — navy wave header, vineyard hero, 2x2 action cards, farm banner, fixed bottom tab bar */

.hero { position: relative; margin-top: -26px; height: clamp(180px, 56vw, 230px); background: center/cover no-repeat; overflow: hidden; }

/* ---------- tab bar ---------- */
.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: #fff; border-top: 1px solid var(--line);

  padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }

.screen { display: flex; flex-direction: column; gap: 14px; padding-block: 0 20px; }

.bar h2 { margin: 0; font-size: 20px; font-weight: 800; flex: 1; }

.btn { width: 100%; border: none; border-radius: 16px; padding: 14px; font-size: 17px; font-weight: 800; background: var(--green); color: #fff;
  display: flex; align-items: center; justify-content: center; gap: 8px; }

/* login */

let gwLastTap = 0; document.addEventListener('touchend', e => { const n = Date.now(); if (n - gwLastTap < 300 && !e.target.closest('input,textarea,select')) e.preventDefault(); gwLastTap = n; }, { passive: false });
document.addEventListener('contextmenu', e => { if (!e.target.closest('input,textarea')) e.preventDefault(); });
</script>

function mountAds() {

  const box = document.querySelector('[data-ads]'); if (!box) return;
  const slides = [...box.querySelectorAll('.ad')], dots = [...box.querySelectorAll('[data-addot]')];

  function show(n) {
    clearTimeout(adTimer); cur = n;
    slides.forEach((s,k) => {
      s.classList.toggle('on', k === n);
      if (s.tagName === 'VIDEO') {
        s.onended = null;
        if (k === n) { s.muted = true; try { s.currentTime = 0; } catch(e){} const p = s.play(); if (p) p.catch(()=>{}); if (slides.length > 1) s.onended = next; }
        else s.pause();

    dots.forEach((d,k) => d.classList.toggle('on', k === n));
    if (slides.length > 1) adTimer = setTimeout(next, slides[n].tagName === 'VIDEO' ? 30000 : 5000);

function gwNotifs() {
  const since = Date.now() - 21*DAY, out = [];
  TASKS.forEach(t => { if ((t.createdAt||0) > since) out.push({ id:'t-'+t.id, t: t.kind==='spray'?'بخّة جديدة':'تسميد جديد', b:`${t.kind==='spray'?'بخّة':'تسميد'} ${t.product||t.type||''} بتاريخ ${fmt(t.date)}`, d:new Date(t.createdAt), go:t.kind });

function gwApply(rows) {

async function gwLoad() {

}

  if (error) throw error;
}

        <span class="cta" style="margin-top:6px">عرض الملف ${I.chev}</span>
      </div>
    </button>
  </main>`;
}
const bar = t => `<div class="bar gut"><button class="back" id="btn-back" data-go="home" aria-label="رجوع">${I.back}</button><h2>${t}</h2></div>`;
const statusOf = t => (isDone(t) || daysTo(t.date) < 0) ? '<span class="status st-done">سابقة</span>' : daysTo(t.date) === 0 ? '<span class="status st-wait">اليوم</span>' : '<span class="status st-wait">قادمة</span>';

function taskView(kind, id) {
  const t = id ? TASKS.find(x=>x.id===id) : nextOf(kind);
  const title = kind==='spray' ? 'البخة القادمة' : 'التسميد القادم';
  if (!t) return bar(title) + `<div class="gut"><div class="panel empty">لا توجد ${kind==='spray'?'بخّة':'عملية تسميد'} قادمة حالياً.</div></div>`;
  const rows = kind==='spray'
    ? [['المبيد / المنتج',t.product],['المادة الفعالة',t.active],['عدد الخزانات',t.tanks],['الجرعة لكل خزان',t.dose],['سعة الخزان',t.water],['طريقة الاستخدام',t.method]]
    : [['نوع السماد',t.type],['اسم المنتج',t.product],['الكمية',t.qty],['الجرعة',t.dose],['طريقة الإضافة',t.method]];
  const done = isDone(t);
  const doneAt = S.done[t.id] ? new Date(S.done[t.id]) : null;
  return bar(id ? (kind==='spray'?'تفاصيل البخّة':'تفاصيل التسميد') : title) + `<div class="screen gut" style="padding-top:14px">
    <div class="top-card"><img src="${kind==='spray'?IMG.spray:IMG.sprout}" alt="" style="${kind==='spray'?'background:#fff;border-radius:14px;padding:4px':''}">
      <div><div class="d">الموعد · ${whenTxt(t.date)}</div><div class="big">${longD(t.date)}</div><div style="margin-top:6px">${statusOf(t)}</div></div></div>
    ${t.img?`<div class="panel"><h4>صورة المنتج</h4>
      <button class="prod" id="btn-zoom" data-zoom="${t.id}" aria-label="تكبير صورة المنتج"><img src="${t.img}" alt="${esc(t.product)}"><span class="zoom-hint">اضغط للتكبير</span></button>
      <div class="cap">${esc(t.product)}</div></div>`:''}
    <div class="panel"><h4>${kind==='spray'?'المواد والجرعات':'السماد والكميات'}</h4>
      <dl class="kv">${rows.filter(r=>r[1]).map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl></div>
    ${t.instructions?`<div class="panel"><h4>التعليمات</h4><div class="note">${esc(t.instructions)}</div></div>`:''}
    ${t.notes?`<div class="panel"><h4>ملاحظات</h4><div class="note">${esc(t.notes)}</div></div>`:''}
  </div>`;
}
let taskFilter = 'up';
function tasksView() {
  const all = TASKS.slice().sort((a,b)=>a.date-b.date);
  const groups = { up: all.filter(t=>!isDone(t) && daysTo(t.date)>=0), done: all.filter(t=>isDone(t) || daysTo(t.date)<0).reverse() };
  if (!groups[taskFilter]) taskFilter = 'up';
  const list = groups[taskFilter];
  return bar('المواعيد والمهام') + `<div class="screen gut" style="padding-top:14px">
    <div class="seg" role="tablist">
      <button class="${taskFilter==='up'?'on':''}" data-filter="up">القادمة (${groups.up.length})</button>
      <button class="${taskFilter==='done'?'on':''}" data-filter="done">السابقة (${groups.done.length})</button>
    </div>
    <div class="list">${list.length ? list.map(t=>`
      <button class="item" data-go="${t.kind}" data-id="${t.id}">
        <span class="ic"><img src="${t.img || (t.kind==='spray'?IMG.spray:IMG.sprout)}" alt="" style="${t.img?'width:42px;height:42px;object-fit:cover;border-radius:10px':t.kind==='fert'?'background:#0B2250;border-radius:8px':''}"></span>
        <span class="t"><b>${t.kind==='spray'?'بخّة':'تسميد'} — ${esc(t.product||t.type||'')}</b><span>${longD(t.date)} · ${(isDone(t)||daysTo(t.date)<0)?'سابقة':whenTxt(t.date)}</span></span>
        ${statusOf(t)}
      </button>`).join('') : '<div class="empty">لا توجد مهام هنا.</div>'}</div>
  </div>`;
}
let openInv = null;
function debtsView() {
  const total = INVOICES.reduce((a,v)=>a+v.total,0);
  const prev = ACCT.filter(x=>x.type==='debt').reduce((a,x)=>a+x.amount,0), paid = ACCT.filter(x=>x.type==='payment').reduce((a,x)=>a+x.amount,0);
  const left = Math.round((total + prev - paid)*100)/100;
  return bar('فواتيري') + `<div class="screen gut" style="padding-top:14px">
    <div class="tot main" style="display:grid;gap:8px;text-align:right;padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:15px">${left>0?'الصافي: باقي عليّ':left<0?'الصافي: إلي رصيد':'الصافي: حسابي خالص ✓'}</span><b style="font-size:26px;color:var(--gold)">${money(Math.abs(left))}</b></div>
      <div class="acc-rows"><span>الفواتير <b>${money(total)}</b></span>${prev?`<span>دين سابق <b>${money(prev)}</b></span>`:''}<span>المدفوع <b>${money(paid)}</b></span></div></div>
    ${ACCT.length ? `<div class="acc-list">${ACCT.map(x=>`<div class="acc-it ${x.type}"><span>${x.type==='payment'?'دفعة':'دين سابق'}${x.reason?' · '+esc(x.reason):''}<small>${WD[x.date.getDay()]} ${fmt(x.date)}</small></span><b>${x.type==='payment'?'−':'+'}${money(x.amount)}</b></div>`).join('')}</div>` : ''}
    <p class="lock" style="margin:0">اضغط على الفاتورة لتشوف شو فيها</p>
    ${INVOICES.map(v => { const open = openInv===v.id; return `
      <button class="invc ${open?'open':''}" data-inv="${v.id}" aria-expanded="${open}">
        <span class="ih"><span class="ic"><img src="${v.cat==='fert'?IMG.sprout:IMG.spray}" alt="" style="${v.cat==='fert'?'background:#0B2250;border-radius:8px':''}"></span>
          <b class="it">${v.cat==='fert'?'تسميد':'بخّة'}</b><span class="amt">${money(v.total)}</span><span class="chev">${I.chev}</span></span>
        ${open?`<span class="ib"><span class="idt">${I.cal} ${WD[v.date.getDay()]} ${fmt(v.date)}</span>
          ${v.items.map(x=>`<span class="il"><span>${esc(x[0])}</span><span>${x[2]} × ${money(x[1])}</span><b>${money(x[1]*x[2])}</b></span>`).join('')}</span>`:''}
      </button>`; }).join('')}
    <div class="lock">الفواتير بتنسجّل من الإدارة. لأي استفسار تواصل مع المؤسسة.</div>
  </div>`;
}
function farmView() {
  const f = FARMER;
  return bar('بيانات مزرعتي') + `<div class="screen gut" style="padding-top:14px">
    <div class="panel" style="padding:0;overflow:hidden"><div style="height:130px;background:url(${IMG.house}) center/cover"></div></div>
    <div class="panel"><h4>المزرعة</h4><dl class="kv">${[['الموقع',f.location],['المساحة',f.area],['نوع العنب',f.grape],['عدد الكروم',f.vines],['الري',f.irrigation]].filter(r=>r[1]).map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('') || '<dd style="grid-column:1/-1;color:var(--muted)">ما في معلومات بعد</dd>'}</dl></div>
    <div class="panel"><h4>صاحب المزرعة</h4><dl class="kv"><dt>الاسم</dt><dd>${esc(f.full)}</dd>${f.phone?`<dt>الهاتف</dt><dd dir="ltr" style="text-align:right">${esc(f.phone)}</dd>`:''}</dl></div>
    ${f.notes?`<div class="panel"><h4>ملاحظات الإدارة</h4><div class="note">${esc(f.notes)}</div></div>`:''}
  </div>`;
}
function notifsView() {
  const ns = NOTIFS();
  return bar('الإشعارات') + `<div class="screen gut" style="padding-top:14px"><div class="list">${ns.map(n=>`
    <button class="item" data-go="${n.go}" data-read="${n.id}">
      <span class="ic">${I.bell}</span><span class="t"><b>${esc(n.t)}</b><span>${esc(n.b)}</span><span style="display:block">${fmt(n.d)}</span></span>
      ${!n.self && !S.read[n.id]?'<span class="unread" aria-label="غير مقروء"></span>':''}
    </button>`).join('')}</div></div>`;
}
function accountView() {
  return bar('حسابي') + `<div class="screen gut" style="padding-top:14px">
    <div class="top-card"><div class="logo" style="width:64px;height:64px;background-image:url(${IMG.logo});box-shadow:none"></div>
      <div><div class="big">${esc(FARMER.full)}</div><div class="d" dir="ltr" style="text-align:right">${esc(FARMER.phone)}</div></div></div>
    <div class="list">
      <button class="item" data-go="farm"><span class="ic">${I.home}</span><span class="t"><b>بيانات مزرعتي</b></span></button>
      <button class="item" data-go="notifs"><span class="ic">${I.bell}</span><span class="t"><b>الإشعارات</b></span></button>
      <button class="item" data-go="debts"><span class="ic">${I.wal}</span><span class="t"><b>فواتيري</b></span></button>
    </div>
    <button class="btn ghost" id="btn-logout">${I.out} تسجيل الخروج</button>
    ${GWC?'':'<div class="lock">نسخة تجريبية · البيانات المعروضة مثال حتى ربط التطبيق بقاعدة بيانات الإدارة</div>'}
  </div>`;
}
let loginStep = 1, loginErr = '';
let loginPhone = '';
function loginView() {
  return `<div class="lg">
    <div class="lg-hero" style="background-image:url(${IMG.hero})">
      <div class="lg-shade"></div>
      <svg class="lg-wave" viewBox="0 0 400 40" preserveAspectRatio="none"><path d="M0 40V22C90 4 170 2 240 16S350 36 400 14V40Z" fill="#EEF2F9"/></svg>
    </div>
    <div class="lg-logo" style="background-image:url(${IMG.logo})" role="img" aria-label="شعار"></div>
    <div class="lg-body gut">
      <h1>عالم العنب والزراعة</h1>
      <p class="lg-sub">اكتب الكود اللي أعطاك ياه المهندس</p>
      <form id="login-form" class="lg-card" novalidate>
        <label>كود الدخول</label>
        <div class="otp six" dir="ltr">${[0,1,2,3,4,5].map(k=>`<input class="otp-in" id="otp-${k}" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="رقم ${k+1}">`).join('')}</div>
        ${GWC?'':'<div class="lg-hint">للتجربة: الكود <b>123456</b></div>'}
        <button class="btn" type="submit">${I.check} دخول</button>
        ${loginErr?`<div class="err">${loginErr}</div>`:''}
      </form>
      <p class="lg-help">ما عندك كود؟ تواصل مع المؤسسة.</p>
      <div class="lg-foot">بإدارة <b>صالح الحسين</b></div>
    </div>
  </div>`;
}
const TABS = [['account','حسابي','user'],['debts','فواتيري','wal'],['fert','التسميد','leaf'],['spray','البخات','sprayT'],['home','الرئيسية','home']];
function tabs() {
  return `<nav class="tabs" aria-label="التنقل"><div class="in">${TABS.map(([v,l,ic])=>
    `<button id="tab-${v}" data-go="${v}" class="${(view===v||(view==='notifs'&&v==='home'&&false))?'on':''}">${I[ic]}<span>${l}</span></button>`).join('')}</div></nav>`;
}
/* welcome screen: shown each time the app opens */
(function () {
  const sp = document.getElementById('splash');
  sp.style.backgroundImage = `url(${IMG.hero})`;
  document.getElementById('splash-logo').style.backgroundImage = `url(${IMG.logo})`;
  let gone = false;
  const close = () => { if (gone) return; gone = true; sp.classList.add('out'); setTimeout(() => sp.hidden = true, 460); };
  document.getElementById('btn-enter').addEventListener('click', close);
  setTimeout(close, 4500);
})();
function render() {
  if (!S.logged) { clearTimeout(adTimer); root.innerHTML = loginView(); return; }
  const v = { home, spray:()=>taskView('spray',param), fert:()=>taskView('fert',param), tasks:tasksView, debts:debtsView, farm:farmView, notifs:notifsView, account:accountView }[view] || home;
  root.innerHTML = `<div class="app">${v()}</div>` + tabs();
  mountAds();
}
function go(v, p=null) { view = v; param = p; render(); window.scrollTo(0,0);
  const h = v==='home' ? '' : '#'+v; if (location.hash !== h) history.replaceState(null,'', h || location.pathname + location.search); }
let tt; function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(()=>t.hidden=true, 2600); }

document.addEventListener('click', e => {
  const doneB = e.target.closest('[data-done]');
  if (doneB) {
    const id = doneB.dataset.done;
    document.getElementById('confirm-area').innerHTML = `<div class="confirm"><p>هل نفّذت ${view==='spray'?'البخّة':'التسميد'} فعلاً؟ سيصل التأكيد إلى الإدارة.</p>
      <div class="row2"><button class="btn" id="btn-yes" data-yes="${id}">نعم، تم</button><button class="btn ghost" id="btn-no" data-no>إلغاء</button></div></div>`;
    return;
  }
  const yes = e.target.closest('[data-yes]');
  if (yes) {
    const id = yes.dataset.yes;
    if (GWC && sb) { yes.disabled = true; yes.textContent = 'جاري الإرسال…';
      sb.rpc('farmer_confirm', { task_id: id }).then(({ error }) => { if (error) { toast('ما زبط الإرسال. تأكد من الإنترنت وجرّب.'); render(); return; }
        S.done[id] = Date.now(); save(); const t = TASKS.find(x=>x.id===id); if (t) t.status = 'done'; param = id; render(); toast('تم إرسال تأكيد التنفيذ إلى الإدارة ✓'); });
      return; }
    S.done[id] = Date.now(); save(); param = id; render(); toast('تم إرسال تأكيد التنفيذ إلى الإدارة ✓'); return; }
  if (e.target.closest('[data-no]')) { render(); return; }
  const z = e.target.closest('[data-zoom]');
  if (z) { const t = TASKS.find(x=>x.id===z.dataset.zoom); const zb = document.getElementById('zoom'); zb.querySelector('img').src = t.img; zb.querySelector('b').textContent = t.product; zb.hidden = false; return; }
  if (e.target.closest('#zoom')) { document.getElementById('zoom').hidden = true; return; }
  const f = e.target.closest('[data-filter]'); if (f) { taskFilter = f.dataset.filter; render(); return; }
  const inv = e.target.closest('[data-inv]'); if (inv) { openInv = openInv===inv.dataset.inv ? null : inv.dataset.inv; render(); return; }
  if (e.target.closest('#btn-logout') && GWC && sb) { gwLogout(); return; }
  if (e.target.closest('#btn-logout')) { S.logged = false; loginStep = 1; loginErr=''; save(); render(); return; }
  const g = e.target.closest('[data-go]');
  if (g) { if (g.dataset.read) { S.read[g.dataset.read] = 1; save(); } go(g.dataset.go, g.dataset.id || null); }
});
document.addEventListener('input', e => {
  if (!e.target.classList.contains('otp-in')) return;
  e.target.value = e.target.value.replace(/\D/g,'').slice(-1);
  const k = +e.target.id.split('-')[1];
  if (e.target.value && k < 5) document.getElementById('otp-'+(k+1)).focus();
  if (k === 5 && e.target.value) document.getElementById('login-form').requestSubmit();
});
document.addEventListener('keydown', e => {
  if (e.target.classList?.contains('otp-in') && e.key === 'Backspace' && !e.target.value) { const k = +e.target.id.split('-')[1]; if (k > 0) document.getElementById('otp-'+(k-1)).focus(); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'login-form') return; e.preventDefault();
  const code = [0,1,2,3,4,5].map(k=>document.getElementById('otp-'+k).value).join('');
  if (code.length < 6) { loginErr = 'الكود 6 أرقام. كمّله.'; render(); document.getElementById('otp-0').focus(); return; }
  if (GWC && sb) {
    const b = e.target.querySelector('[type=submit]'); b.disabled = true; b.textContent = 'جاري الدخول…';
    gwLogin(code).then(() => { loginErr=''; view='home'; gwStart().then(() => toast('أهلاً ' + FARMER.name)); })
      .catch(x => { loginErr = x.code==='bad_code' ? 'الكود غلط. تأكد منه أو تواصل مع المؤسسة.' : x.code==='locked' ? 'محاولات كتير. استنّى ربع ساعة وجرّب.' : navigator.onLine===false ? 'ما في إنترنت.' : 'ما زبط الدخول. جرّب مرة ثانية.'; render(); });
    return;
  }
  if (code !== '123456') { loginErr = 'الكود غلط. تأكد منه أو تواصل مع المؤسسة.'; render(); document.getElementById('otp-0').focus(); return; }
  S.logged = true; save(); loginErr=''; go('home'); toast('أهلاً ' + FARMER.name);
});
if (GWC && sb) sb.auth.getSession().then(({ data }) => { if (data.session) gwStart(); });
const fromHash = () => { const h = location.hash.slice(1); go(['spray','fert','tasks','debts','farm','notifs','account'].includes(h) ? h : 'home'); };
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
</body></html>
