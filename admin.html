.upl { border: 2px dashed var(--line); border-radius: 14px; background: #fff; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--muted); font-weight: 600; font-size: 14px; }
.upl img { display: block; max-width: 100%; max-height: 180px; width: auto; height: auto; border-radius: 10px; }
.upl label.btn { color: #fff; }
.upl .row { display: flex; gap: 8px; width: 100%; }
.upl label.btn { cursor: pointer; }
.err { color: var(--red-ink); font-weight: 700; font-size: 14px; }
.confirmbox { background: #FFF5F5; border: 2px solid var(--red); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.confirmbox p { margin: 0; font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  background: var(--navy-2); color: #fff; padding: 10px 18px; border-radius: 14px; font-weight: 700; box-shadow: 0 8px 20px rgba(0,0,0,.25); max-width: calc(100% - 32px); text-align: center; }
.offline { background: #FFF2DE; color: #7A4A0B; border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 600; margin-top: 10px; }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } .sheet { animation: none; } }
.lgw { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
.lgw-top { background: var(--navy); color: #fff; text-align: center; padding: 48px 16px 70px; border-radius: 0 0 36px 36px; display: grid; justify-items: center; gap: 4px; }
.lgw-top .logo { width: 96px; height: 96px; }
.lgw-top h1 { margin: 12px 0 0; font-size: 24px; }
.lgw-top p { margin: 0; color: var(--onnav); font-weight: 700; }
.lgw-card { background: #fff; margin: -44px 16px 0; border-radius: 22px; padding-block: 22px; box-shadow: 0 10px 30px rgba(11,34,80,.12); display: grid; gap: 12px; max-width: 460px; align-self: center; width: calc(100% - 32px); }
.lgw-card label { font-weight: 800; }
.lgw-card input { font-size: 28px; letter-spacing: 8px; text-align: center; padding: 12px; border: 2px solid var(--line); border-radius: 14px; background: var(--soft); font-weight: 800; }
.lgw-card input:focus { border-color: var(--navy); outline: none; }
.lgw-help { margin: 0; color: var(--muted); font-size: 13.5px; font-weight: 600; text-align: center; }
.lgw-foot { margin-top: auto; text-align: center; padding: 24px; color: var(--muted); }
</style>

<div id="view"></div>
<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>

const WD = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const dayName = s => s ? WD[parse(s).getDay()] : '';
const fmt = s => { if (!s) return '—'; const d = parse(s); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; };
const daysTo = s => Math.round((parse(s) - parse(todayISO())) / DAY);
const whenTxt = s => { const n = daysTo(s); return n===0?'اليوم':n===1?'غداً':n>1?`بعد ${n} أيام`:n===-1?'أمس':`قبل ${-n} يوم`; };
const money = n => { const v = Math.round((+n||0)*100)/100; return '\u200E' + (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString('en-US', { maximumFractionDigits: 2 }); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const initial = n => (String(n||'؟').trim()[0] || '؟');
const photoURL = p => !p ? '' : /^(data:|https?:)/.test(p) ? p : '/_blob/' + p;
let tt; function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(()=>t.hidden=true, 2600); }

/* ---------- data store: shared database when available, this device otherwise ---------- */
const D = { farmers: [], tasks: [], ledger: [], products: [], ads: [], staff: [] };
let db = null, assets = null, downloads = null, mode = 'loading';
const LKEY = 'grape-admin-local-v1';
function loadLocal() { try { const s = JSON.parse(localStorage.getItem(LKEY)); if (s) Object.assign(D, s); } catch(e){} }
function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify(D)); } catch(e){} }
async function put(col, id, data) {
  const doc = { ...data, id };
  if (sb) { const { error } = await sb.from('docs').upsert({ col, id, data: doc }); if (error) { gwFail(error); throw error; } }
  else if (db) { await db.collection(col).doc(id).set(doc); }
  const arr = D[col]; const i = arr.findIndex(x => x.id === id);
  if (i >= 0) arr[i] = doc; else arr.push(doc);
  if (!db) saveLocal();
  render();
}
async function del(col, id) {
  if (sb) { const { error } = await sb.from('docs').delete().match({ col, id }); if (error) { gwFail(error); throw error; } }
  else if (db) await db.collection(col).doc(id).delete();
  D[col] = D[col].filter(x => x.id !== id);
  if (!db) saveLocal();
  render();
}
async function connect() {
  if (GWC && window.supabase) return gwConnect();
  let loadingTimer = setTimeout(() => { if (mode === 'loading') { mode = 'slow'; render(); } }, 10000);
  try { db = window.claude?.use ? await window.claude.use('db') : null; } catch(e) { db = null; }
  try { assets = window.claude?.use ? await window.claude.use('assets') : null; } catch(e) { assets = null; }
  try { downloads = window.claude?.use ? await window.claude.use('downloads') : null; } catch(e) { downloads = null; }
  if (!db) { clearTimeout(loadingTimer); mode = 'local'; loadLocal(); render(); return; }
  let got = 0;
  for (const col of ['farmers','tasks','ledger','products','ads','staff']) {
    db.collection(col).onSnapshot(snap => {
      D[col] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      if (!snap.metadata.fromCache && ++got >= 6) { clearTimeout(loadingTimer); mode = 'live'; }
      if (mode === 'loading' && got >= 6) mode = 'live';
      render();
    }, () => { mode = 'error'; render(); });
  }
}


/* ---------- central database (Android / iPhone build) ---------- */
const GWC = window.GW_CFG || null;
let sb = null, gwAuth = null, gwChan = null, gwLoadT = null;
function gwFail(e) { toast(navigator.onLine === false ? 'ما في إنترنت. جرّب لما يرجع النت.' : /duplicate|unique/i.test(e?.message||'') ? 'الكود مستعمل. جرّب مرة ثانية.' : 'ما زبط الحفظ. جرّب مرة ثانية.'); }
async function gwConnect() {
  sb = window.supabase.createClient(GWC.url, GWC.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'gw-admin' } });
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { gwAuth = null; mode = 'login'; render(); } });
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { mode = 'login'; render(); return; }
  gwStart(session);
}
function gwStart(session) {
  const m = session.user.app_metadata || {};
  gwAuth = { role: m.gw_role, ref: m.gw_ref };
  ui.asStaff = m.gw_role === 'staff' ? m.gw_ref : '';
  assets = {
    upload: async (blob, o) => { const ct = (o && o.type) || blob.type || 'image/jpeg'; const ext = ct === 'video/mp4' ? '.mp4' : ct === 'image/png' ? '.png' : '.jpg';
      const path = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8) + ext;
      const { error } = await sb.storage.from('media').upload(path, blob, { contentType: ct }); if (error) throw error;
      return { id: sb.storage.from('media').getPublicUrl(path).data.publicUrl }; },
    delete: async (url) => { const p = String(url).split('/media/')[1]; if (p) await sb.storage.from('media').remove([p]); }
  };
  mode = 'loading'; route.v = 'home'; render();
  gwLoadAll(); gwSubscribe();
}
async function gwLoadAll() {
  if (!sb || !gwAuth) return;
  try {
    const who = await sb.rpc('gw_me');
    if (!who.error && !who.data) { gwLogout('الكود تغيّر. فوت بالكود الجديد.'); return; }
    const all = [];
    for (let from = 0; ; from += 1000) { const { data, error } = await sb.from('docs').select('col,id,data').range(from, from + 999); if (error) throw error; all.push(...data); if (data.length < 1000) break; }
    for (const k of Object.keys(D)) D[k] = [];
    for (const r of all) if (D[r.col]) D[r.col].push({ ...r.data, id: r.id });
    if (gwAuth.role === 'staff' && !D.staff.some(x => x.id === gwAuth.ref)) { gwLogout('الكود تغيّر أو انحذف. اطلب كود جديد من المدير.'); return; }
    mode = 'live'; render();
  } catch (e) { mode = navigator.onLine === false ? 'offline' : 'error'; render(); }
}
function gwSubscribe() {
  if (gwChan) sb.removeChannel(gwChan);
  gwChan = sb.channel('docs-admin').on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, p => {
    if (p.eventType === 'DELETE') { const o = p.old || {}; if (o.col && D[o.col]) D[o.col] = D[o.col].filter(x => x.id !== o.id); }
    else { const r = p.new || {}; if (D[r.col]) { const arr = D[r.col], doc = { ...r.data, id: r.id }, i = arr.findIndex(x => x.id === r.id); if (i >= 0) arr[i] = doc; else arr.push(doc); } }
    clearTimeout(gwLoadT); gwLoadT = setTimeout(render, 120);
  }).subscribe();
}
async function gwLogin(code, app) {
  const r = await fetch(GWC.url + '/functions/v1/login', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: GWC.key, Authorization: 'Bearer ' + GWC.key }, body: JSON.stringify({ code, app }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'server'); e.code = j.error || 'server'; throw e; }
  const { data, error } = await sb.auth.setSession({ access_token: j.access_token, refresh_token: j.refresh_token });
  if (error) throw error;
  return data.session;
}
let gwMsg = '';
async function gwLogout(msg) { gwMsg = msg || ''; if (gwChan) { sb.removeChannel(gwChan); gwChan = null; } for (const k of Object.keys(D)) D[k] = []; ui.asStaff = ''; gwAuth = null; mode = 'login'; try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {} render(); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && gwAuth) gwLoadAll(); });
setInterval(async () => { if (gwAuth && sb && document.visibilityState === 'visible') { const w = await sb.rpc('gw_me'); if (!w.error && !w.data) gwLogout('الكود تغيّر. فوت بالكود الجديد.'); } }, 30000);
window.addEventListener('online', () => { if (gwAuth) { gwLoadAll(); gwSubscribe(); } });

/* ---------- ads screen (shared) ---------- */
let adTimer = null;
function adsHTML(items) {
  if (!items.length) return '';
  return `<div class="ads" data-ads>${items.map((a,k)=> a.type==='video'
      ? `<video class="ad${k===0?' on':''}" src="${esc(a.src)}" muted playsinline preload="auto"${items.length===1?' loop':''} aria-hidden="true"></video>`
      : `<img class="ad${k===0?' on':''}" src="${esc(a.src)}" alt="">`).join('')}
    ${items.length>1?`<div class="ad-dots">${items.map((_,k)=>`<button type="button" class="${k===0?'on':''}" data-addot="${k}" aria-label="إعلان ${k+1}"></button>`).join('')}</div>`:''}</div>`;
}
function mountAds() {
  clearTimeout(adTimer);
  const box = document.querySelector('[data-ads]'); if (!box) return;
  const slides = [...box.querySelectorAll('.ad')], dots = [...box.querySelectorAll('[data-addot]')];
  let cur = 0;
  const next = () => show((cur + 1) % slides.length);
  function show(n) {
    clearTimeout(adTimer); cur = n;
    slides.forEach((s,k) => {
      s.classList.toggle('on', k === n);
      if (s.tagName === 'VIDEO') {
        s.onended = null;
        if (k === n) { s.muted = true; try { s.currentTime = 0; } catch(e){} const p = s.play(); if (p) p.catch(()=>{}); if (slides.length > 1) s.onended = next; }
        else s.pause();
      }
    });
    dots.forEach((d,k) => d.classList.toggle('on', k === n));
    if (slides.length > 1) adTimer = setTimeout(next, slides[n].tagName === 'VIDEO' ? 30000 : 5000);
  }
  dots.forEach(d => d.addEventListener('click', e => { e.stopPropagation(); show(+d.dataset.addot); }));
  show(0);
}

/* image → compressed JPEG */
function compress(file, max=1000, q=.8) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const s = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas');
      c.width = Math.round(im.width*s); c.height = Math.round(im.height*s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res({ blob: b, preview: c.toDataURL('image/jpeg', q) }) : rej(), 'image/jpeg', q);
    }; im.onerror = rej; im.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

  if (ds.copycode) { const c = ds.copycode; try { await navigator.clipboard.writeText(c); toast('انتسخ الكود: ' + c); } catch(x) { const r = document.createRange(); const el2 = document.getElementById('farmer-code'); if (el2) { r.selectNodeContents(el2); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast('حدد الكود وانسخه'); } return; }
  if (ds.newcode) { const f = farmer(ds.newcode); if (!f) return; if (f.code && el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'متأكد؟ الكود القديم بيوقف'; return; } await put('farmers', f.id, { ...f, code: newCode(), updatedAt: Date.now() }); toast('انعمل كود جديد'); return; }
  if (ds.admove) { const [id, dir] = ds.admove.split(':'); const L = adsSorted(); const k = L.findIndex(a=>a.id===id), j2 = k + +dir;
    if (k < 0 || j2 < 0 || j2 >= L.length) return; const A1 = L[k], A2 = L[j2]; const o1 = A1.order||k, o2 = A2.order||j2;
    await put('ads', A1.id, { ...A1, order: o2 === o1 ? o1 + +dir : o2 }); await put('ads', A2.id, { ...A2, order: o1 }); return; }
  if (ds.adtoggle) { const a = D.ads.find(x=>x.id===ds.adtoggle); if (a) { await put('ads', a.id, { ...a, active: a.active===false }); toast(a.active===false ? 'صار ظاهر للمزارعين' : 'انخفى عن المزارعين'); } return; }
  if (ds.addel) { if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.classList.add('sure'); el.innerHTML = 'احذف؟'; return; }
    const a = D.ads.find(x=>x.id===ds.addel); if (!a) return;
    await del('ads', a.id); if (assets && a.media && !String(a.media).startsWith('data:')) { try { await assets.delete(a.media); } catch(x){} }
    toast('انحذف الإعلان'); return; }
  if (ds.stk) { const [k,v] = ds.stk.split(':'); ui[k] = v; render(); return; }
  if (ds.stkopen !== undefined) { ui.stockOpen = ui.stockOpen === ds.stkopen ? '' : ds.stkopen; render(); return; }
  if (ds.ktab) { ui.kindTab = ds.ktab; render(); return; }
  if (ds.ttab) { ui.taskTab = ds.ttab; render(); return; }
  if (ds.markdone) { const t = D.tasks.find(x=>x.id===ds.markdone); await put('tasks', t.id, { ...t, status:'done', doneBy:'admin', doneAt: Date.now() }); toast('سُجّلت كمنفّذة'); return; }
  if (ds.undone) { const t = D.tasks.find(x=>x.id===ds.undone); const { doneAt, doneBy, ...rest } = t; await put('tasks', t.id, { ...rest, status:'pending' }); return; }
  if (ds.askdel) {
    const what = ds.askdel==='staff' ? 'هالموظف؟ الكود تبعه بيوقف' : ds.askdel==='farmer' ? 'ملف المزارع وكل مهامه وحساباته' : ds.askdel==='task' ? 'هذه المهمة' : ds.askdel==='product' ? 'هذه المادة من قائمة الأسعار' : 'هذه العملية المالية';
    const area = el.closest('#del-area');
    area.innerHTML = `<div class="confirmbox"><p>متأكد من حذف ${what}؟ ما في رجعة.</p><div class="actions">
      <button type="button" class="btn red" data-dodel="${ds.askdel}" data-id="${esc(ds.fid||ds.tid||ds.lid||ds.pid||ds.stid)}">نعم، احذف</button><button type="button" class="btn ghost" data-canceldel>إلغاء</button></div></div>`;
    return;
  }
  if ('canceldel' in ds) { if (el.closest('.sheet')) { const f = el.closest('form'); if (f.id==='form-staff') staffSheet(f.dataset.sid); else if (f.id==='form-purchase') purchaseSheet({ lid: f.dataset.lid }); else if (f.id==='form-product') productSheet(f.dataset.pid); else ledgerSheet({ lid: f.dataset.lid }); } else render(); return; }
  if (ds.dodel) {
    el.disabled = true;
    try {
      if (ds.dodel === 'farmer') {
        for (const t of D.tasks.filter(t=>t.farmerId===ds.id)) await del('tasks', t.id);
        for (const l of D.ledger.filter(l=>l.farmerId===ds.id)) await del('ledger', l.id);
        await del('farmers', ds.id); go('farmers'); toast('تم حذف ملف المزارع');
      } else if (ds.dodel === 'task') { const fid = route.fid; await del('tasks', ds.id); go(fid?'farmer':'tasks', { fid }); toast('تم الحذف'); }
      else if (ds.dodel === 'staff') { await del('staff', ds.id); closeSheet(); toast('انحذف الموظف'); }
      else if (ds.dodel === 'product') { await del('products', ds.id); closeSheet(); toast('تم حذف المادة'); }
      else { await del('ledger', ds.id); closeSheet(); toast('تم حذف العملية'); }
    } catch(err) { el.disabled = false; toast('ما زبط الحذف. تأكد من الإنترنت وجرّب مرة ثانية.'); }
    return;
  }
  if ('backup' in ds && downloads) {
    try { await downloads.save({ filename: `grape-backup-${todayISO()}.json`, data: JSON.stringify({ exportedAt: new Date().toISOString(), ...D }, null, 2) }); toast('تم تجهيز النسخة الاحتياطية'); }
    catch(err) { toast('تم إلغاء التنزيل'); }
    return;
  }
  if (ds.go) {
    const back = ds.go;
    if (back === 'farmer') { const fid = ds.fid || route.fid; if (fid && farmer(fid)) go('farmer', { fid }); else go('home'); return; }
    if (back === 'statement') { go('statement', { fid: ds.fid || route.fid }); return; }
    go(back);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && ['e-count','e-price'].includes(e.target.id)) { e.preventDefault(); addSelected(false); return; }
  if (e.key === 'Enter' && e.target.id === 'q-pick') { e.preventDefault(); document.querySelector('#pick-grid [data-sel]')?.click(); return; }
  if (e.key === 'Enter' && ['e-name','e-qty'].includes(e.target.id)) {
    e.preventDefault();
    if (e.target.id === 'e-name') document.getElementById('e-price').focus();
    else if (e.target.id === 'e-price') document.getElementById('e-qty').focus();
    else addEntry(false);
  }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target, fd = Object.fromEntries(new FormData(form).entries());
  for (const k in fd) fd[k] = String(fd[k]).trim();
  const err = form.querySelector('#err'), btn = form.querySelector('[type=submit]');
  const fail = m => { err.textContent = m; err.hidden = false; btn.disabled = false; };
  btn.disabled = true;
  try {
    if (form.id === 'form-login') {
      const code = (fd.code||'').replace(/\D/g,'');
      if (code.length < 6) return fail('الكود 6 أرقام أو أكثر.');
      btn.textContent = 'جاري الدخول…';
      try { gwMsg = ''; const s = await gwLogin(code, 'admin'); gwStart(s); toast('أهلاً فيك'); }
      catch (x) { btn.innerHTML = `${I.check} دخول`; return fail(x.code==='bad_code' ? 'الكود غلط. تأكد منه.' : x.code==='locked' ? 'محاولات كتير. استنّى ربع ساعة وجرّب.' : navigator.onLine===false ? 'ما في إنترنت.' : 'ما زبط الدخول. جرّب مرة ثانية.'); }
      return;
    }
    if (form.id === 'form-farmer') {
      if (!fd.name) return fail('اكتب اسم المزارع.');
      const id = form.dataset.fid || uid(); const old = farmer(id) || { createdAt: Date.now() };
      const { sample, ...keep } = old;
      await put('farmers', id, { ...keep, ...fd, code: keep.code || newCode(), updatedAt: Date.now() });
      closeSheet(); go('farmer', { fid: id }); toast(form.dataset.fid ? 'تم حفظ التعديل' : 'تمت إضافة المزارع');
    }
    if (form.id === 'form-task') {
      const targets = form.dataset.tid ? [fd.farmerId].filter(Boolean) : new FormData(form).getAll('farmers').map(String);
      delete fd.farmers;
      if (!targets.length) return fail(form.dataset.tid ? 'اختر المزارع.' : 'اختر مزارع واحد على الأقل.');
      if (!fd.date) return fail('حدد موعد.');
      if (form.dataset.kind==='spray' ? !fd.product : !fd.type) return fail(form.dataset.kind==='spray' ? 'اكتب اسم المبيد.' : 'اكتب نوع السماد.');
      const id = form.dataset.tid || uid(); const old = D.tasks.find(x=>x.id===id) || { status:'pending', createdAt: Date.now() };
      let photo = old.photo || '';
      if (pendingPhoto?.remove) photo = '';
      else if (pendingPhoto?.blob) {
        btn.textContent = 'جاري رفع الصورة…';
        if (assets) { try { photo = (await assets.upload(pendingPhoto.blob, { type:'image/jpeg' })).id; } catch(x) { photo = await smallDataURL(pendingPhoto.blob); } }
        else photo = await smallDataURL(pendingPhoto.blob);
      }
      let video = old.video || '';
      if (pendingVideo?.remove) video = '';
      else if (pendingVideo?.file) {
        if (!assets) return fail('رفع الفيديو غير متاح هون. افتح التطبيق المنشور وجرّب.');
        btn.textContent = 'جاري رفع الفيديو…';
        try { video = (await assets.upload(pendingVideo.file, { type: pendingVideo.type })).id; }
        catch(x) { return fail(x?.code==='too_large' ? 'الفيديو كبير. صوّر مقطع أقصر (أقل من 20 ميغا).' : x?.code==='unsupported_type' ? 'صيغة الفيديو غير مدعومة. استخدم MP4.' : 'ما زبط رفع الفيديو. جرّب مرة ثانية.'); }
      }
      if (fd.tanks) fd.tanks = String(Math.min(10, Math.max(1, parseInt(fd.tanks)||1)));
      const dateChanged = old.date && old.date !== fd.date;
      if (form.dataset.tid) {
        await put('tasks', id, { ...old, ...fd, kind: form.dataset.kind, photo, video, updatedAt: Date.now(), ...(dateChanged ? { rescheduledAt: Date.now() } : {}) });
        closeSheet(); go('task', { tid: id, fid: fd.farmerId }); toast('تم الحفظ — التعديل بيوصل للمزارع');
      } else {
        const group = targets.length > 1 ? uid() : '';
        let firstId = '';
        for (const fid of targets) { const nid = targets.length === 1 ? id : uid(); firstId = firstId || nid;
          await put('tasks', nid, { ...old, ...fd, farmerId: fid, kind: form.dataset.kind, photo, video, group, updatedAt: Date.now() }); }
        closeSheet();
        if (targets.length === 1) go('task', { tid: firstId, fid: targets[0] }); else go(form.dataset.kind==='spray'?'sprays':'ferts');
        toast(targets.length === 1 ? `انضافت ووصلت لـ ${fname(targets[0])}` : `انضافت لـ ${targets.length} مزارعين`);
      }
    }
    if (form.id === 'form-staff') {
      const name = (document.getElementById('st-name').value||'').trim();
      if (!name) return fail('اكتب اسم الموظف.');
      const perms = [...form.querySelectorAll('input[name=perm]:checked')].map(c=>c.value);
      if (perms.includes('farmersEdit') && !perms.includes('farmers')) perms.push('farmers');
      const id = form.dataset.sid || uid(); const old = D.staff.find(x=>x.id===id) || { createdAt: Date.now() };
      await put('staff', id, { ...old, name, phone: (document.getElementById('st-phone').value||'').trim(), perms, code: old.code || newCode(), updatedAt: Date.now() });
      closeSheet(); toast(form.dataset.sid ? 'انحفظ التعديل' : 'انضاف الموظف مع كود دخول');
    }
    if (form.id === 'form-purchase') {
      const fid = fd.farmerId;
      if (!fid) return fail('اختر المزارع.');
      if (!addSelected(true)) return fail('كمّل المنتج اللي اخترته أو اضغط «أضف».');
      if (!pItems.length) return fail('أضف منتج واحد على الأقل.');
      if (!fd.date) return fail('حدد التاريخ.');
      const items = pItems.map(l => ({ name: l.name, price: l.price, qty: l.qty, total: Math.round(l.price*l.qty*100)/100 }));
      const amount = Math.round(items.reduce((a,i)=>a+i.total,0)*100)/100;
      const paidNow = +(D.ledger.find(x=>x.id===form.dataset.lid)?.paid) || 0;
      const id = form.dataset.lid || uid(); const old = D.ledger.find(x=>x.id===id) || { createdAt: Date.now() };
      const { product, qty, price, ...keep } = old;
      await put('ledger', id, { ...keep, no: keep.no || nextInvoiceNo(), paid: paidNow, farmerId: fid, type:'debt', source:'purchase', category: pCat, items, amount, date: fd.date,
        reason: `${CATS[pCat]}: ${items.map(i=>i.name).join('، ')}`, updatedAt: Date.now() });
      for (const it of items) {
        const p = productByName(it.name);
        if (!p) await put('products', uid(), { name: it.name, price: it.price, category: pCat, used: 1, createdAt: Date.now() });
        else if (!form.dataset.lid) await put('products', p.id, { ...p, category: p.category || pCat, used: (p.used||0) + 1 });
      }
      closeSheet(); if (route.v==='farmer') go('statement', { fid }); toast(`انحفظت الفاتورة — ${money(amount)}`);
    }
    if (form.id === 'form-product') {
      const name = (document.getElementById('pr-name').value||'').trim(), price = Math.round((parseFloat(document.getElementById('pr-price').value)||0)*100)/100;
      if (!name) return fail('اكتب اسم الدوا.');
      if (!(price > 0)) return fail('اكتب السعر.');
      const id = form.dataset.pid || productByName(name)?.id || uid(); const old = D.products.find(x=>x.id===id) || { createdAt: Date.now(), used: 0 };
      await put('products', id, { ...old, name, price, category: document.getElementById('pr-cat').value, updatedAt: Date.now() });
      closeSheet(); toast(`انحفظ: ${name} — ${money(price)}`);
    }
    if (form.id === 'form-ledger') {
      if (!fd.farmerId) return fail('اختر المزارع.');
      const amount = Math.round(parseFloat(fd.amount) * 100) / 100;
      if (!(amount > 0)) return fail('اكتب مبلغ أكبر من صفر.');
      if (!fd.date) return fail('حدد التاريخ.');
      const id = form.dataset.lid || uid(); const old = D.ledger.find(x=>x.id===id) || { createdAt: Date.now() };
      await put('ledger', id, { ...old, ...fd, amount, type: form.dataset.type, updatedAt: Date.now() });
      closeSheet(); toast(form.dataset.type==='debt' ? 'تم تسجيل الدين' : `تم تسجيل الدفعة — المتبقي ${money(balanceOf(fd.farmerId))}`);
    }
  } catch(x) {
    fail(x?.code === 'quota_exceeded' ? 'امتلأت مساحة التخزين. احذف بيانات قديمة.' : 'ما زبط الحفظ. تأكد من الإنترنت وجرّب مرة ثانية.');
  }
});

render();
connect();
</script>
